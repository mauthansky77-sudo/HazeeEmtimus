services:
  - type: web
    name: hazee-key-trial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_PATH
        value: /tmp/hazee/hazee.sqlite3
